[package]
name = "atlas-mcp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
worker = "0.8.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# NOT `strip = true`: it strips the wasm module's target_features custom
# section, which wasm-bindgen needs to detect reference-types support before
# running its externref transform. Without it, worker-build's mandatory
# catch-wrapper generation fails with "externref table required for catch
# wrappers". wasm-bindgen already drops debug info by default, so binary
# size is essentially the same either way.
